<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="SVG View & Edit">
  <title>SVG View &amp; Edit</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <radialGradient id="glow-cyan" cx="0.12" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0.98" cy="0.95" r="0.75">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <mask id="dots-fade">
      <rect x="720" y="0" width="560" height="320" fill="url(#fade-grad)"/>
    </mask>
    <linearGradient id="fade-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.35" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="ic-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="ic-code" gradientUnits="userSpaceOnUse" x1="44" y1="0" x2="104" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ic-art" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow-cyan)"/>
  <rect width="1280" height="320" fill="url(#glow-violet)"/>
  <rect x="720" y="0" width="560" height="320" fill="url(#dots)" mask="url(#dots-fade)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>

  <g transform="translate(80 86) scale(0.6)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#ic-bg)"/>
    <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="125" y="44" width="6" height="66" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <g stroke="url(#ic-code)" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M52 58 H96"/>
      <path d="M52 77 H80"/>
      <path d="M52 96 H96"/>
    </g>
    <path d="M156 106 C 156 70 176 50 206 50 C 206 86 186 106 156 106 Z" fill="url(#ic-art)"/>
    <g fill="#ffffff">
      <rect x="149" y="99" width="12" height="12" rx="3"/>
      <rect x="200" y="44" width="12" height="12" rx="3"/>
    </g>
    <text x="128" y="208" text-anchor="middle" font-family="Consolas, 'Cascadia Mono', monospace" font-size="76" font-weight="700" fill="#ffffff">.svg</text>
  </g>

  <text x="288" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#ffffff">SVG View &amp; Edit</text>
  <text x="290" y="198" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="400" fill="#9aa4b2">View and edit SVG side by side — live preview, no rename needed.</text>
  <rect x="290" y="230" width="380" height="6" rx="3" fill="url(#accent)"/>
</svg>
